<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ESSÊNCIA</title>
    <script>
      // Salvar o caminho atual no sessionStorage
      var path = window.location.pathname
      var search = window.location.search
      var hash = window.location.hash

      // Evitar loop: só redirecionar se não for a raiz
      if (path !== '/' && path !== '') {
        sessionStorage.setItem('spa_redirect', path + search + hash)
      }

      // Sempre ir para a raiz
      window.location.replace('/')
    </script>
  </head>
  <body></body>
</html>
